<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI for Digital Accessibility</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>AI for Digital Accessibility</h1>
        <p>Making digital content easier to understand and access.</p>
    </header>

    <main>

        <section class="card">

            <h2>Accessibility Assistant</h2>

            <label for="feature">Choose an accessibility feature:</label>

            <select id="feature">
                <option value="simplify">Text Simplification</option>
                <option value="image">Image Description</option>
                <option value="voice">Voice Assistance</option>
            </select>

            <label for="inputText">Enter text:</label>

            <textarea
                id="inputText"
                placeholder="Enter difficult or complex text here..."
            ></textarea>

            <button id="processButton">
                Make Accessible
            </button>

            <h3>Accessible Output</h3>

            <div id="output">
                Your accessible content will appear here.
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
